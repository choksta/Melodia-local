name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一分支上的新推送取消仍在跑的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # shared 的测试跑在桌面 JVM 目标上，覆盖网络、加密与仓储层；桌面端依赖 libmpv 的用例在 Linux 上自动跳过
      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest :shared:desktopTest :desktopApp:test --no-daemon

      # 测试失败时把失败用例连同断言信息转成 annotation。
      # 下载 job 日志要 token，而 check-run 注解是公开可读的——不登录也能看到是哪条用例挂了。
      - name: 汇总失败用例
        if: failure()
        run: |
          cat > /tmp/report_failures.py <<'PY'
          import glob
          import re

          found = 0
          for path in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              text = open(path, encoding='utf-8', errors='replace').read()
              pattern = (r'<testcase name="([^"]*)" classname="([^"]*)"[^>]*>'
                         r'\s*<failure[^>]*message="([^"]{0,240})')
              for match in re.finditer(pattern, text):
                  found += 1
                  message = ' '.join(match.group(3).split())
                  print(f"::error title={match.group(2)}::{match.group(1)} — {message}")
          if found == 0:
              print('::error::测试报告里没有失败用例，失败可能发生在编译或环境准备阶段')
          print(f'共 {found} 条失败用例')
          PY
          python3 /tmp/report_failures.py

      # 桌面端只做编译检查，安装包在发版时由 Windows runner 打
      - name: 桌面端编译
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

      # release 构建同时验证 R8 规则：接口或序列化器被误裁时此步会失败
      - name: Release 构建（含 R8）
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            desktopApp/build/reports/tests/
          retention-days: 7

      - name: 上传 APK 与混淆映射
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
