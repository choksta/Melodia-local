name: Release

# 推送 v1.2.3 / v1.2.3-beta.1 / v1.2.3-beta.1-local28 形式的 tag 时触发：
# 用 secrets 里的签名构建 APK，成功后才创建 GitHub Release。
#
# ⚠️ 签名策略（改动前务必读完，否则会让所有已安装的用户无法覆盖升级）
# ---------------------------------------------------------------------------
# 发布签名固定用「本机 ~/.android/debug.keystore」那把钥匙，证书指纹
#   0D:32:1B:9D:A9:99:04:08:58:8E:3D:A5:B2:1E:E8:F1:DE:B4:3E:11:96:A2:44:3E:F5:D6:1A:30:09:2E:00:7C
# 原因：GitHub 上 local1~local5 以及用户手机上装的版本都是它，只有同签名才能
# 直接覆盖安装。换成任何别的 keystore 都会导致 INSTALL_FAILED_UPDATE_INCOMPATIBLE，
# 用户必须先卸载（登录态、歌单、设置全部丢失）。
#
# 「校验签名指纹与预期一致」那一步就是这条约束的硬门禁：指纹不匹配直接失败，
# 不会静默发出一个装不上的包。换签名时那一步和 secrets 都必须同步改，
# 并且要接受「所有已安装用户必须卸载重装」的代价。
#
# -localN 参与 versionCode（20512 + N），App 的更新检查靠比较 versionCode 判断更新；
# 若不让它参与，同一个 beta.1 反复发版时 code 永远不变，客户端会一直认为已是最新。
# Release 正文里的 <!-- versionCode=N --> 标记同样是必需的，客户端解析 tag 时
# 会跳过含 -local 的，只认这个标记。
#
# 预发布 tag 允许打在 main 或 dev，正式版 tag 必须打在 main 上，否则直接失败。
# 手动运行为演练：按输入的版本号打包、作为 artifact 留存，不创建 Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '演练用版本号，如 1.2.3 或 1.2.3-beta.1（不带 v）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 版本号只解析一次，两端构建与发布共用
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      # 校验 tag 所在分支需要完整历史与远端分支
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 tag 解析版本号
        id: version
        env:
          DRY_RUN_VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG_NAME=${DRY_RUN_VERSION:-${GITHUB_REF_NAME#v}}
          # -localN 是本仓库自己的构建序号（如 v2.1.0-beta.1-local28），只用来区分多次构建，
          # 不参与版本号计算：剥掉后再解析。name 仍输出带后缀的完整版本，APK 文件名也带它，
          # 这样同一个 beta.1 可以反复发构建而不必为了 versionCode 去改版本号
          SEMVER_TAG=$(printf '%s' "$TAG_NAME" | sed -E 's/-local[0-9]+$//')
          BASE_VERSION=${SEMVER_TAG%%-*}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "tag 格式不是 vMAJOR.MINOR.PATCH[-beta.N|-rc.N][-localN]：$TAG_NAME" >&2
            exit 1
          fi

          # 预发布 tag 用 v1.2.3-beta.1 / v1.2.3-rc.1 形式，同一版本号下 beta < rc < 正式版，
          # 保证 versionCode 严格递增，覆盖安装不会被系统当成降级拒绝
          if [ "$SEMVER_TAG" = "$BASE_VERSION" ]; then
            PRERELEASE=false
            SUB_CODE=99
          else
            PRERELEASE=true
            SUFFIX=${SEMVER_TAG#"$BASE_VERSION"-}
            KIND=${SUFFIX%%.*}
            NUM=${SUFFIX#*.}
            if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
              echo "预发布 tag 需要形如 v1.2.3-beta.1 的编号：$TAG_NAME" >&2
              exit 1
            fi
            case "$KIND" in
              beta)
                if [ "$NUM" -gt 49 ]; then
                  echo "beta 编号超出上限 49：$NUM" >&2
                  exit 1
                fi
                SUB_CODE=$NUM
                ;;
              rc)
                if [ "$NUM" -gt 48 ]; then
                  echo "rc 编号超出上限 48：$NUM" >&2
                  exit 1
                fi
                SUB_CODE=$((50 + NUM))
                ;;
              *)
                echo "不支持的预发布类型（仅支持 beta/rc）：$KIND" >&2
                exit 1
                ;;
            esac
          fi

          # -localN 必须参与 versionCode 计算。
          #
          # 原来只用 semver 推导，同一个 beta.1 反复发版时 code 永远是 2010001——
          # 本地序号从 local28 涨到 local29，versionCode 却一动不动，App 的更新检查
          # （比较 versionCode）永远判不出新版本，表现就是「点了检查更新说已是最新」。
          #
          # 基数 20512 是为了衔接已有的本地序列：local28 = 20540，正是手机上装着的那个，
          # 不能比它小，否则新包会变成降级安装。
          LOCAL_NUM=$(printf '%s' "$TAG_NAME" | sed -nE 's/.*-local([0-9]+)$/\1/p')
          if [ -n "$LOCAL_NUM" ]; then
            VERSION_CODE=$(( 20512 + LOCAL_NUM ))
          else
            VERSION_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + SUB_CODE ))
          fi
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # 手动演练没有 tag，按所选分支构建，不做校验
      - name: 校验 tag 所在分支
        if: github.event_name == 'push'
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # 远端分支引用不一定随 checkout 落地；拿不到就不拦，避免一个环境差异卡住发版
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "警告：本地没有 origin/main 引用，跳过分支校验" >&2
            exit 0
          fi

          if [ "$PRERELEASE" = "true" ]; then
            # 预发布在本仓库允许打在 main 上：单人维护，没有 dev 流转
            for BRANCH in main dev; do
              if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null &&
                git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
                echo "tag $GITHUB_REF_NAME 位于 $BRANCH 分支"
                exit 0
              fi
            done
            echo "tag $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 既不在 main 也不在 dev 上" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "正式版 tag 必须打在 main 上：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 位于 main 分支"

  # 本仓库只分发 Android（README 的 Platform 一节已去掉 Windows），
  # 桌面端打包已从发版流程移除；需要时从 git 历史取回 desktop job
  android:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # certutil -encode 会在内容前后包一层 -----BEGIN/END CERTIFICATE----- 分隔行，
      # 这两行不是合法 base64 字符，grep 过滤掉再拼接解码，兼容两种生成方式
      - name: 写入签名 keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | grep -v -- '-----BEGIN\|-----END' \
            | tr -d '\r\n' \
            | base64 -d > melodia-release.jks

      # 四项 secret 缺任意一项，build.gradle.kts 的 hasReleaseSigning 就是 false，
      # release 会**静默退回 debug 签名**——构建照样成功，直到六分钟后才在校验步骤炸掉。
      # 所以先在这里判一遍：只打印长度和 alias 名，不打印任何密码值。
      - name: 检查签名材料是否齐全
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -u
          MISSING=""
          [ -n "$KEYSTORE_B64" ] || MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || MISSING="$MISSING RELEASE_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || MISSING="$MISSING RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || MISSING="$MISSING RELEASE_KEY_PASSWORD"
          echo "keystore base64 长度 = ${#KEYSTORE_B64}"
          echo "store password 长度 = ${#STORE_PASSWORD}"
          echo "key alias = ${KEY_ALIAS:-<空>}"
          echo "key password 长度 = ${#KEY_PASSWORD}"
          if [ -n "$MISSING" ]; then
            echo "::error::以下 secret 为空或未配置：$MISSING"
            exit 1
          fi
          ls -l melodia-release.jks
          if [ ! -s melodia-release.jks ]; then
            echo "::error::melodia-release.jks 是空文件，RELEASE_KEYSTORE_BASE64 解码失败"
            exit 1
          fi
          # 顺带确认 keystore 里真有这个 alias、密码也对得上（输出不含密码）
          keytool -list -keystore melodia-release.jks -storepass "$STORE_PASSWORD" 2>&1 | head -15 || true
          echo "keystore 证书 SHA256（应与下方校验步骤里的 EXPECTED_SHA256 一致）："
          keytool -list -v -keystore melodia-release.jks -storepass "$STORE_PASSWORD" 2>/dev/null | grep -m1 "SHA256:" || true

      - name: Release 构建（正式签名）
        env:
          RELEASE_STORE_FILE: melodia-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PreleaseVersionName=${{ needs.version.outputs.name }} \
            -PreleaseVersionCode=${{ needs.version.outputs.code }} \
            --no-daemon

      # 四项签名 secret 缺任一项时 build.gradle.kts 会静默退回 debug 签名。
      #
      # 这一段刻意写得啰嗦：原版用 `DN=$(apksigner ... | grep -m1 ...)`，
      # 一旦 APK 名字对不上或 apksigner 没输出证书，grep 返回 1，命令替换带着非零退出码
      # 在 `set -e` 下**静默退出**——日志只有 "Process completed with exit code 1"，
      # 完全看不出是找不到文件还是签名不对。所以这里每一步都单独判空，并且全部用
      # `::error::` 输出，失败原因会直接显示在 check-run 注解里，不用登进去翻日志。
      - name: 校验签名指纹与预期一致
        run: |
          set -u
          APK_DIR=app/build/outputs/apk/release
          APK="$APK_DIR/Melodia-v${{ needs.version.outputs.name }}-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::找不到预期产物 $APK（版本名 ${{ needs.version.outputs.name }}）"
            echo "目录实际内容："
            ls -l "$APK_DIR" || true
            # 兜底：目录里只有一个 release APK 时就用它，避免命名规则差异卡住发版
            CANDIDATES=("$APK_DIR"/*-release.apk)
            if [ "${#CANDIDATES[@]}" -eq 1 ] && [ -f "${CANDIDATES[0]}" ]; then
              APK="${CANDIDATES[0]}"
              echo "::warning::改用目录中唯一的 release 产物：$APK"
            else
              exit 1
            fi
          fi

          # apksigner 的查找要足够宽容：runner 镜像升级会动 SDK 路径
          # （注解里已经提示 ubuntu-latest 在 2026-10-19 起迁到 Ubuntu 26），
          # 原版写死 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"，一旦两个变量都空，
          # find 对着 /build-tools 报错返回 1，整个 step 在 set -e 下静默退出。
          APKSIGNER=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER=$(command -v apksigner)
          fi
          if [ -z "$APKSIGNER" ]; then
            for CANDIDATE in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                             /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              [ -n "$CANDIDATE" ] && [ -d "$CANDIDATE/build-tools" ] || continue
              APKSIGNER=$(find "$CANDIDATE/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
              [ -n "$APKSIGNER" ] && break
            done
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，无法校验签名"
            echo "ANDROID_HOME=${ANDROID_HOME:-<空>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<空>}"
            for CANDIDATE in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              echo "探测 $CANDIDATE: $(ls -d "$CANDIDATE" 2>/dev/null || echo 不存在)"
            done
            exit 1
          fi
          echo "校验工具：$APKSIGNER"
          echo "待校验文件：$APK"

          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          echo "$CERTS"
          if ! echo "$CERTS" | grep -qi "certificate DN"; then
            echo "::error::apksigner 未输出证书信息，无法确认签名（详见上一条输出）"
            exit 1
          fi

          # 判据是「签名指纹是否等于预期」，而不是「DN 里有没有 Android Debug」。
          # 比指纹才能同时做到：防配错 keystore + 不因签名身份叫什么名字而误判。
          #
          # 这里刻意用本机 ~/.android/debug.keystore：GitHub 上的 local1~local5
          # 和用户手机上装的版本都是它（指纹 0D:32:1B:9D:...，已实测比对），
          # 用同一把钥匙，新包才能直接覆盖安装而不必卸载。换签名时这里要跟着改。
          EXPECTED_SHA256="0D:32:1B:9D:A9:99:04:08:58:8E:3D:A5:B2:1E:E8:F1:DE:B4:3E:11:96:A2:44:3E:F5:D6:1A:30:09:2E:00:7C"
          normalize() { printf '%s' "$1" | tr -d ':' | tr 'A-Z' 'a-z' | tr -d '[:space:]'; }
          ACTUAL_SHA256=$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 | sed 's/.*digest: *//')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::apksigner 输出里没有 SHA-256 指纹，无法确认签名身份"
            exit 1
          fi
          if [ "$(normalize "$ACTUAL_SHA256")" != "$(normalize "$EXPECTED_SHA256")" ]; then
            echo "::error::签名指纹与预期不符，签名材料可能配错了"
            echo "预期：$EXPECTED_SHA256"
            echo "实际：$ACTUAL_SHA256"
            exit 1
          fi
          echo "签名指纹校验通过：$ACTUAL_SHA256"

      - name: 清理 keystore
        if: always()
        run: rm -f melodia-release.jks

      # 用通配而不是拼死文件名：命名规则一旦跟 build.gradle.kts 的 archivesName 有出入，
      # 拼死的路径会让「构建成功但上传失败」，比什么都不传更难查
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 生成分类日志需要完整提交历史和全部 tag，checkout 默认浅克隆（depth=1）拿不到
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载两端安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 按 commit message 的 conventional commits 前缀（feat/fix/refactor...）自己分类生成
      - name: 生成分类日志
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="HEAD"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD"

          declare -A TITLES=(
            [feat]="✨ 新功能" [fix]="🐛 修复" [refactor]="♻️ 重构"
            [perf]="⚡ 性能" [docs]="📝 文档" [test]="✅ 测试"
            [build]="📦 构建" [ci]="🔧 CI" [chore]="🧹 杂项" [style]="🎨 样式"
          )
          ORDER=(feat fix refactor perf build docs test ci chore style)
          declare -A BUCKETS
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TYPE=$(echo "$line" | grep -oE '^[a-z]+' || true)
            if [ -n "$TYPE" ] && [ -n "${TITLES[$TYPE]:-}" ]; then
              BUCKETS[$TYPE]="${BUCKETS[$TYPE]:-}"$'\n'"- $line"
            else
              OTHER="$OTHER"$'\n'"- $line"
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:'%s')

          {
            # App 的更新检查靠这行 HTML 注释读 versionCode：tag 形如
            # v2.1.0-beta.1-local29 无法用 semver 推导，客户端解析不到 code 就会
            # **整条 release 被忽略**，表现同样是「检查更新说已是最新」。
            # HTML 注释不会显示在发布页上。
            echo "<!-- versionCode=${{ needs.version.outputs.code }} -->"
            for t in "${ORDER[@]}"; do
              if [ -n "${BUCKETS[$t]:-}" ]; then
                echo "### ${TITLES[$t]}"
                echo "${BUCKETS[$t]}"
                echo ""
              fi
            done
            if [ -n "$OTHER" ]; then
              echo "### 📌 其他"
              echo "$OTHER"
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: release-notes.md
          # 一律发成正式 Release：本仓库只有 local 构建，没有「稳定版 / 预发布」之分，
          # 而 GitHub 的 /releases/latest 只认非 prerelease——标成预发布会让 latest
          # 永远停在旧版本（README 徽章、第三方工具、App 的更新检查都跟着错）
          prerelease: false
          files: dist/*
